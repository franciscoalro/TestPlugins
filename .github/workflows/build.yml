name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Clean build cache
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream

      - name: Build All Plugins
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          command: ./gradlew make --no-daemon --no-build-cache

      - name: Collect Build Outputs
        run: |
          echo "=== Coletando arquivos .cs3 e .jar ==="
          mkdir -p output/plugins
          
          # Copiar todos os .cs3
          find . -path "*/build/*.cs3" -exec cp {} output/plugins/ \;
          
          # Copiar todos os .jar (renomeando para nome do plugin)
          for dir in */; do
            if [ -f "${dir}build.gradle.kts" ]; then
              plugin_name=$(basename "$dir")
              jar_path="${dir}build/intermediates/aar_main_jar/release/classes.jar"
              if [ -f "$jar_path" ]; then
                cp "$jar_path" "output/plugins/${plugin_name}.jar"
                echo "✅ ${plugin_name}.jar copiado"
              fi
            fi
          done
          
          echo "=== Arquivos coletados ==="
          ls -la output/plugins/

      - name: Upload Plugins
        uses: actions/upload-artifact@v4
        with:
          name: Cloudstream-Plugins
          path: output/plugins/*

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep "version = " MaxSeries/build.gradle.kts 2>/dev/null | sed 's/version = //' | tr -d ' ' | tr -d '"' || echo "1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/plugins/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
