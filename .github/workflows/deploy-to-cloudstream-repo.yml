name: Deploy to CloudstreamRepo

on:
  workflow_run:
    workflows: ["Build and Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy manual'
        required: false
        default: 'Deploy manual'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout TestPlugins
        uses: actions/checkout@v4
        with:
          path: testplugins

      - name: Checkout CloudstreamRepo
        uses: actions/checkout@v4
        with:
          repository: franciscoalro/CloudstreamRepo
          token: ${{ secrets.CLOUDSTREAM_REPO_TOKEN }}
          path: cloudstream-repo

      - name: Download Build Artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          name: Cloudstream-Plugins

      - name: Copy CS3 and JAR Files (from artifacts)
        if: github.event_name == 'workflow_run'
        run: |
          echo "📦 Copiando arquivos .cs3 e .jar dos artefatos..."
          mkdir -p cloudstream-repo/builds
          
          # Copiar arquivos dos artefatos
          cp artifacts/*.cs3 cloudstream-repo/builds/ 2>/dev/null || true
          cp artifacts/*.jar cloudstream-repo/builds/ 2>/dev/null || true
          
          ls -la cloudstream-repo/builds/

      - name: Copy CS3 and JAR Files (from local builds)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "📦 Copiando arquivos .cs3 e .jar do diretorio local builds/..."
          mkdir -p cloudstream-repo/builds
          
          # Copiar do diretório builds local
          cp testplugins/builds/*.cs3 cloudstream-repo/builds/ 2>/dev/null || true
          cp testplugins/builds/*.jar cloudstream-repo/builds/ 2>/dev/null || true
          
          ls -la cloudstream-repo/builds/

      - name: Update repo.json and plugins.json
        run: |
          echo "📝 Atualizando repo.json e plugins.json..."
          cp testplugins/repo.json cloudstream-repo/
          cp testplugins/plugins.json cloudstream-repo/builds/
          
          echo "📊 Verificando alterações..."
          cd cloudstream-repo
          git status

      - name: Commit and Push
        run: |
          cd cloudstream-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [[ -n $(git status --porcelain) ]]; then
            echo "🔄 Fazendo commit das alterações..."
            git add .
            git commit -m "Auto-update plugins from TestPlugins build $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ Deploy realizado com sucesso!"
          else
            echo "ℹ️ Nenhuma alteração detectada"
          fi

      - name: Create Summary
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Updated:" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 CS3 and JAR plugins copied to builds/" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 repo.json updated" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 builds/plugins.json updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [CloudstreamRepo](https://github.com/franciscoalro/CloudstreamRepo)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository URL for CloudStream:" >> $GITHUB_STEP_SUMMARY
          echo "📋 \`https://raw.githubusercontent.com/franciscoalro/CloudstreamRepo/main/repo.json\`" >> $GITHUB_STEP_SUMMARY
