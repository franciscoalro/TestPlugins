name: Release v263 - PlayerEmbedAPI Otimizado

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MaxSeries/src/**'
      - 'release-notes-v263.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MaxSeries
        run: |
          cd MaxSeries
          chmod +x ../gradlew
          ../gradlew clean assembleRelease -x test --no-daemon

      - name: Prepare Release Files
        run: |
          # Copiar .aar como .cs3
          cp MaxSeries/build/outputs/aar/MaxSeries-release.aar MaxSeries.cs3
          
          # Calcular tamanho e hash
          FILE_SIZE=$(stat -c%s MaxSeries.cs3)
          FILE_HASH=$(sha256sum MaxSeries.cs3 | cut -d' ' -f1)
          
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "FILE_HASH=$FILE_HASH" >> $GITHUB_ENV
          
          echo "Tamanho: $FILE_SIZE bytes"
          echo "SHA256: $FILE_HASH"

      - name: Update JSON Files
        run: |
          FILE_SIZE=${{ env.FILE_SIZE }}
          FILE_HASH=${{ env.FILE_HASH }}
          VERSION="263"
          
          # plugins.json
          cat > plugins.json << EOF
          [
            {
              "url": "https://raw.githubusercontent.com/franciscoalro/TestPlugins/main/MaxSeries.cs3",
              "status": 1,
              "version": $VERSION,
              "apiVersion": 1,
              "name": "MaxSeries",
              "internalName": "MaxSeries",
              "authors": ["franciscoalro"],
              "description": "MaxSeries v$VERSION - PlayerEmbedAPI Otimizado: V8 (Pure HTTP) prioritario + V7 (WebView) com timeout 25s como fallback",
              "repositoryUrl": "https://github.com/franciscoalro/TestPlugins",
              "tvTypes": ["TvSeries", "Movie"],
              "language": "pt-BR",
              "iconUrl": "https://raw.githubusercontent.com/franciscoalro/TestPlugins/main/icon.png",
              "fileSize": $FILE_SIZE
            }
          ]
          EOF
          
          # repo.json
          cat > repo.json << EOF
          {
            "name": "MaxSeries",
            "description": "MaxSeries v$VERSION - PlayerEmbedAPI Otimizado: V8 (Pure HTTP) prioritario + V7 (WebView) com timeout 25s como fallback",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/franciscoalro/TestPlugins/main/plugins.json"
            ]
          }
          EOF
          
          # plugins-simple.json
          cat > plugins-simple.json << EOF
          [
            {
              "url": "https://github.com/franciscoalro/TestPlugins/releases/download/v$VERSION/MaxSeries.cs3",
              "status": 1,
              "version": $VERSION,
              "name": "MaxSeries",
              "description": "MaxSeries v$VERSION - PlayerEmbedAPI Otimizado"
            }
          ]
          EOF
          
          # plugins-minimal.json
          cat > plugins-minimal.json << EOF
          [
            {
              "name": "MaxSeries",
              "description": "MaxSeries v$VERSION - PlayerEmbedAPI Otimizado: V8 (Pure HTTP) prioritario + V7 (WebView) com timeout 25s como fallback",
              "version": "$VERSION",
              "url": "https://github.com/franciscoalro/TestPlugins/releases/download/v$VERSION/MaxSeries.cs3",
              "status": 1,
              "apiVersion": 1
            }
          ]
          EOF

      - name: Commit Updated JSONs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add plugins.json repo.json plugins-simple.json plugins-minimal.json
          git diff --staged --quiet || git commit -m "Update JSONs for v263 release"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v263
          name: MaxSeries v263
          body: |
            ## MaxSeries v263 - PlayerEmbedAPI Otimizado

            ### Novidades
            - **PlayerEmbedAPI V8 (Pure HTTP)** agora e tentado **PRIMEIRO** (~50-100ms)
            - **PlayerEmbedAPI V7 (WebView)** usado como **FALLBACK** com timeout de **25s**
            - Carregamento de videos muito mais rapido e confiavel

            ### Correcoes
            - Fix: Timeout do V7 causando exception null
            - Fix: Carregamento lento quando V7 era tentado primeiro
            - Otimizacao do fluxo de extracao

            ### Performance
            | Metodo | Tempo Medio | Status |
            |--------|-------------|--------|
            | V8 (Pure HTTP) | ~50-100ms | Principal |
            | V7 (WebView) | Ate 25s | Fallback |

            ### Arquivos
            - **MaxSeries.cs3**: ${{ env.FILE_SIZE }} bytes
            - **SHA256**: `${{ env.FILE_HASH }}`

            ### Instalacao
            1. Baixe o arquivo MaxSeries.cs3
            2. Abra o Cloudstream3
            3. Configuracoes -> Extensoes -> Instalar de arquivo
            4. Selecione o arquivo baixado

            Ou use o repo:
            ```
            https://raw.githubusercontent.com/franciscoalro/TestPlugins/main/repo.json
            ```
          files: |
            MaxSeries.cs3
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ Release v263 criada com sucesso!"
          echo ""
          echo "📊 Resumo:"
          echo "   Versao: v263"
          echo "   Arquivo: MaxSeries.cs3 (${{ env.FILE_SIZE }} bytes)"
          echo "   SHA256: ${{ env.FILE_HASH }}"
