name: Validate Repo Metadata

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repo.json and plugins.json
        run: |
          python tools/validate_cloudstream_repo.py --repo repo.json --plugins plugins.json --strict --check-local
